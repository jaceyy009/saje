<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saje – Log In / Sign Up</title>
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <div id="loading-screen" class="loading-screen">
      <div class="loading-panel">
        <div class="loading-spinner"></div>
        <h2 id="loading-title">Loading Saje...</h2>
        <p id="loading-description">Please wait a moment.</p>
      </div>
    </div>
    
    <main class="auth-container">
      <section class="auth-panel">
        <header class="auth-header">
          <h1 class="logo">Saje</h1>
        </header>

        <div class="auth-tabs">
          <button id="login-tab" class="auth-tab active">Log In</button>
          <button id="signup-tab" class="auth-tab">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email or username</label>
            <input type="text" id="login-email" placeholder="Enter your email or username" required>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="primary-button">Log In</button>
        </form>

        <!-- Registration Form -->
        <form id="signup-form" hidden>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="signup-username">Username</label>
            <input type="text" id="signup-username" placeholder="Choose a username" required>
          </div>

          <div class="form-group">
            <label for="signup-displayname">Display Name</label>
            <input type="text" id="signup-displayname" placeholder="How should people see you?" required>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" placeholder="Create a password" required>
          </div>

          <div class="form-group">
            <label for="signup-confirm-password">Confirm password</label>
            <input type="password" id="signup-confirm-password" placeholder="Enter your password again" required>
          </div>

          <button type="submit" class="primary-button">Create Account</button>
        </form>

        <p id="auth-message" role="status"></p>
      </section>
    </main>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
